x-api-env: &api-env
  PORT: "8080"
  REDIS_MODE: "sentinel"
  REDIS_SENTINEL_ADDRS: "sentinel-1:26379,sentinel-2:26379,sentinel-3:26379"
  REDIS_MASTER_NAME: "mymaster"
  RATE_LIMIT_REQUESTS: "5"
  RATE_LIMIT_WINDOW_SECONDS: "60"

services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-1:
    image: redis:7-alpine
    container_name: sentinel-1
    volumes:
      - ./sentinel/sentinel.conf:/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q redis-master"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started

  sentinel-2:
    image: redis:7-alpine
    container_name: sentinel-2
    volumes:
      - ./sentinel/sentinel.conf:/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q redis-master"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started

  sentinel-3:
    image: redis:7-alpine
    container_name: sentinel-3
    volumes:
      - ./sentinel/sentinel.conf:/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q redis-master"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started

  api-1:
    build: .
    container_name: api-1
    environment:
      <<: *api-env
      INSTANCE_ID: "api-1"
    depends_on:
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy

  api-2:
    build: .
    container_name: api-2
    environment:
      <<: *api-env
      INSTANCE_ID: "api-2"
    depends_on:
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy

  api-3:
    build: .
    container_name: api-3
    environment:
      <<: *api-env
      INSTANCE_ID: "api-3"
    depends_on:
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
