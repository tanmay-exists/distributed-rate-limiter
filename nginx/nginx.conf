events {
    worker_connections 1024;
}

http {
    upstream rate_limiter_api {
        # Round-robin (nginx's default) across all API replicas, so no
        # single instance sees every request. This is what makes the
        # "distributed" claim verifiable end-to-end: the load test tool
        # (cmd/loadtest) hits this address and shows requests fanning out
        # across api-1/api-2/api-3 while the rate limit still holds exactly.
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rate_limiter_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
